<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sedi AIDO - Trova la tua sede</title>
  <style>
    @import url("https://unpkg.com/leaflet@1.9.4/dist/leaflet.css");
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: #f5f5f5;
      touch-action: manipulation
    }

    #header {
      background: #c0392b;
      color: #fff;
      padding: 5px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0
    }

    #header h1 {
      font-size: 20px;
      font-weight: 600
    }

    #header span {
      font-size: 12px;
      opacity: .8
    }

    #controls {
      background: #fff;
      padding: 10px 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0
    }

    #search-box {
      flex: 1;
      display: flex;
      align-items: center;
      background: #f7f7f7;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      padding: 0 10px;
      gap: 6px;
      cursor: pointer;
      min-height: 42px;
      transition: border-color .2s
    }

    #search-box:hover {
      border-color: #c0392b
    }

    #search-display {
      flex: 1;
      font-size: 15px;
      color: #222;
      min-height: 24px;
      line-height: 24px
    }

    #search-display.placeholder {
      color: #aaa
    }

    #search-clear {
      width: 20px;
      height: 20px;
      background: #ccc;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0
    }

    #search-clear.visible {
      display: flex
    }

    #count {
      font-size: 13px;
      color: #666;
      white-space: nowrap
    }

    #container {
      display: flex;
      height: calc(100vh - 116px)
    }

    #map {
      flex: 1;
      cursor: grab;
      position: relative;
    }

    .leaflet-interactive.foreign-land-fog {
      filter: blur(1.5px);
      pointer-events: none;
    }

    .leaflet-interactive.foreign-land-blur {
      filter: blur(6px);
      pointer-events: none;
    }

    .leaflet-interactive.foreign-land-drift {
      filter: blur(12px);
      pointer-events: none;
    }

    #map:active {
      cursor: grabbing
    }

    #sidebar {
      width: 300px;
      background: #fff;
      border-left: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    #list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch
    }

    .item {
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background .1s;
      user-select: none
    }

    .item:active {
      background: #fdecea
    }

    .item.active {
      background: #fff0f0;
      border-left: 4px solid #c0392b;
      padding-left: 12px
    }

    .item h3 {
      font-size: 14px;
      font-weight: 600;
      color: #222;
      margin-bottom: 3px
    }

    .item p {
      font-size: 12px;
      color: #777;
      line-height: 1.5
    }

    #kb-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      z-index: 9000;
      display: none;
      align-items: flex-end
    }

    #kb-overlay.open {
      display: flex
    }

    #kb-panel {
      width: 100%;
      background: #d1d5db;
      padding: 8px 4px 12px;
      border-radius: 16px 16px 0 0;
      user-select: none
    }

    #kb-header {
      display: flex;
      align-items: center;
      padding: 0 8px 8px;
      gap: 8px
    }

    #kb-input-display {
      flex: 1;
      background: #fff;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 18px;
      min-height: 44px;
      color: #222;
      letter-spacing: .5px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      direction: ltr
    }

    #kb-input-display .cursor {
      display: inline-block;
      width: 2px;
      height: 20px;
      background: #c0392b;
      vertical-align: middle;
      animation: blink .8s infinite
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0
      }
    }

    #kb-cancel {
      background: #fff;
      color: #c0392b;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0
    }

    #kb-cancel:active {
      background: #fdecea
    }

    #kb-rows {
      display: flex;
      flex-direction: column;
      gap: 5px
    }

    .kb-row {
      display: flex;
      gap: 5px;
      justify-content: center
    }

    .kb-key {
      background: #fff;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 500;
      color: #222;
      height: 48px;
      min-width: 32px;
      flex: 1;
      max-width: 52px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 0 #9ca3af;
      transition: background .08s, transform .08s;
      -webkit-tap-highlight-color: transparent
    }

    .kb-key:active {
      background: #e5e7eb;
      transform: scale(.95)
    }

    .kb-key.dark {
      background: #adb5c2;
      color: #111;
      font-size: 15px
    }

    .kb-key.dark:active {
      background: #9aa0ab
    }

    .kb-key.space {
      max-width: none;
      flex: 3
    }

    .kb-key.wide {
      max-width: 46px;
      flex: 1
    }

    .kb-key.search-btn {
      background: #c0392b;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      max-width: none;
      flex: 1.5
    }

    .kb-key.search-btn:active {
      background: #922b21
    }

    .kb-key.backspace {
      max-width: 110px;
      flex: 1.6;
    }

    @media(max-width:620px) {
      #container {
        flex-direction: column;
        height: calc(100vh - 116px)
      }

      #sidebar {
        width: 100%;
        height: 220px;
        border-left: none;
        border-top: 1px solid #e0e0e0
      }

      #map {
        flex: 1
      }

      .kb-key {
        height: 44px;
        font-size: 16px
      }
    }

    @media(min-width:900px) {
      #kb-panel {
        max-width: 700px;
        margin: 0 auto;
        border-radius: 16px 16px 0 0
      }

      .kb-key {
        height: 52px;
        font-size: 18px
      }
    }

    .marker-cluster {
      background-clip: padding-box;
    }

    .marker-cluster div {
      width: 36px;
      height: 36px;
      margin-left: -18px;
      margin-top: -18px;
      text-align: center;
      border-radius: 50%;
      background: #c0392b;
      border: 3px solid white;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 12px;
      line-height: 1;
    }

    .marker-cluster span {
      display: inline-block;
    }

    #empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
      text-align: center;
      background: #fff;
    }

    #empty-state.visible {
      display: flex;
    }

    #empty-state img {
      max-width: 200px;
      margin-bottom: 20px;
      opacity: 0.8;
    }

    #empty-state p {
      font-size: 14px;
      color: #999;
      margin: 0;
    }

    .leaflet-control-attribution {
      pointer-events: none;
      opacity: 0;
    }

    .leaflet-control-attribution a {
      pointer-events: none;
      cursor: default;
    }

    #copyright-box {
      position: absolute;
      bottom: 0;
      right: 0;
      background: white;
      padding: 4px 8px;
      font-size: 11px;
      color: #666;
      z-index: 1000;
      border-radius: 4px 0 0 0;
      box-shadow: 0 1px 5px rgba(0,0,0,0.15);
      pointer-events: none;
      user-select: none;
    }

    @media(max-width:620px) {
      #copyright-box {
        font-size: 10px;
        padding: 3px 6px;
      }
    }

    
  </style>
</head>

<body>

  <div id="header">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
      <path
        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
    </svg>
    <div>
      <h1>Sedi AIDO</h1><span>Associazione Italiana Donatori Organi</span>
    </div>
  </div>

  <div id="controls">
    <div id="search-box" onclick="openKb()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2.5">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <div id="search-display" class="placeholder">Cerca città o sede...</div>
      <div id="search-clear" onclick="clearSearch(event)">✕</div>
    </div>
    <span id="count">Caricamento...</span>
  </div>

  <div id="container">
    <div id="map">
      <div id="copyright-box">
        ©OpenStreetMap contributors | Dati mappa ©AIDO | ©Leaflet
      </div>
    </div>
    <div id="sidebar">
      <div id="list"></div>
      <div id="empty-state">
        <img src="../img/donatelloNotFound.png" alt="Nessuna sede trovata">
      </div>
    </div>
  </div>

  <div id="kb-overlay" onclick="handleOverlayClick(event)">
    <div id="kb-panel">
      <div id="kb-header">
        <div id="kb-input-display"><span id="kb-text"></span><span class="cursor"></span></div>
        <button id="kb-cancel" onclick="closeKb()">Chiudi</button>
      </div>
      <div id="kb-rows">
        <div class="kb-row" id="row1"></div>
        <div class="kb-row" id="row2"></div>
        <div class="kb-row" id="row3"></div>
        <div class="kb-row" id="row4"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.1/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.1/dist/MarkerCluster.Default.css" />
  <script>
    const ITALY_BOUNDS = L.latLngBounds([35.2, 6.6], [47.1, 18.8]);
    const ITALY_INTERACTION_BOUNDS = L.latLngBounds([35.2, 5], [47.1, 20]);
    const map = L.map('map', {
      zoomControl: true,
      tap: true,
      tapTolerance: 15,
      minZoom: 6,
      maxZoom: 18,
      zoomSnap: 0.25,
      zoomDelta: 0.25,
      inertia: false,
      bounceAtZoomLimits: false,
      worldCopyJump: false,
      maxBounds: ITALY_INTERACTION_BOUNDS,
      maxBoundsViscosity: 1.0
    }).setView([42.5, 12.5], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      noWrap: true
    }).addTo(map);
    map.createPane('foreignFogPane');
    map.getPane('foreignFogPane').style.zIndex = 330;
    map.getPane('foreignFogPane').style.pointerEvents = 'none';

    function lockMapToItaly() {
      const strictMinZoom = Math.max(6, map.getBoundsZoom(ITALY_INTERACTION_BOUNDS, false));
      map.setMinZoom(strictMinZoom);
      if (map.getZoom() < strictMinZoom) {
        map.setZoom(strictMinZoom, { animate: false });
      }
      map.panInsideBounds(ITALY_INTERACTION_BOUNDS, { animate: false });
    }

    map.whenReady(lockMapToItaly);
    window.addEventListener('resize', lockMapToItaly);

    function addForeignLandFog(countriesTopoJson) {
      function createFogIsland(centerLng, centerLat, radiusLng, radiusLat, points = 48) {
        const coordinates = [];
        for (let i = 0; i <= points; i++) {
          const angle = (i / points) * Math.PI * 2;
          coordinates.push([
            centerLng + Math.cos(angle) * radiusLng,
            centerLat + Math.sin(angle) * radiusLat
          ]);
        }
        return {
          type: 'Feature',
          properties: {},
          geometry: {
            type: 'Polygon',
            coordinates: [coordinates]
          }
        };
      }

      function getRingBounds(ring) {
        return ring.reduce((bounds, [lng, lat]) => ({
          minLng: Math.min(bounds.minLng, lng),
          maxLng: Math.max(bounds.maxLng, lng),
          minLat: Math.min(bounds.minLat, lat),
          maxLat: Math.max(bounds.maxLat, lat)
        }), {
          minLng: Infinity,
          maxLng: -Infinity,
          minLat: Infinity,
          maxLat: -Infinity
        });
      }

      function isWesternAdriaticIslandPolygon(polygon) {
        const ring = polygon[0];
        if (!ring || ring.length < 4) return false;
        const bounds = getRingBounds(ring);
        const width = bounds.maxLng - bounds.minLng;
        const height = bounds.maxLat - bounds.minLat;
        const centerLng = (bounds.minLng + bounds.maxLng) / 2;
        const centerLat = (bounds.minLat + bounds.maxLat) / 2;
        return centerLng > 13 && centerLng < 18.2 &&
          centerLat > 42.1 && centerLat < 45.9 &&
          width < 1.15 &&
          height < 0.65;
      }

      function stripExcludedForeignAreas(feature) {
        const featureId = `${feature.id}`;
        if (featureId === '336' || featureId === '674') return null;
        if (!feature.geometry) return feature;

        if (featureId === '191' && feature.geometry.type === 'MultiPolygon') {
          const filteredCoordinates = feature.geometry.coordinates.filter(polygon => !isWesternAdriaticIslandPolygon(polygon));
          return filteredCoordinates.length ? {
            ...feature,
            geometry: {
              ...feature.geometry,
              coordinates: filteredCoordinates
            }
          } : null;
        }

        return feature;
      }

      const countriesObject = countriesTopoJson.objects.countries;
      const countries = topojson.feature(countriesTopoJson, countriesObject).features;
      const filteredForeignFeatures = countries
        .filter(feature => `${feature.id}` !== '380')
        .map(stripExcludedForeignAreas)
        .filter(Boolean);
      const supplementalFogIslands = {
        type: 'FeatureCollection',
        features: [
          createFogIsland(14.42, 35.93, 0.26, 0.16),
          createFogIsland(14.21, 36.04, 0.12, 0.08),
          createFogIsland(2.65, 39.57, 0.34, 0.22)
        ]
      };
      const foreignCountries = {
        type: 'FeatureCollection',
        features: [
          ...filteredForeignFeatures,
          ...supplementalFogIslands.features
        ]
      };
      const foreignCoastline = topojson.mesh(countriesTopoJson, countriesObject, (a, b) => a === b && `${a.id}` !== '380');
      const italyBoundary = topojson.mesh(countriesTopoJson, countriesObject, (a, b) => {
        if (a === b) return false;
        const aItaly = `${a.id}` === '380';
        const bItaly = `${b.id}` === '380';
        return aItaly !== bItaly && `${a.id}` !== '336' && `${a.id}` !== '674' && `${b.id}` !== '336' && `${b.id}` !== '674';
      });
      const fogCoreStyle = {
        fillColor: '#161616',
        fillOpacity: 0.72,
        stroke: false,
        color: 'transparent',
        opacity: 0,
        weight: 0
      };
      const fogFeatherStyles = [
        { color: '#2e2e2e', opacity: 0.22, weight: 20, className: 'foreign-land-blur' },
        { color: '#494949', opacity: 0.2, weight: 31, className: 'foreign-land-blur' },
        { color: '#676767', opacity: 0.18, weight: 44, className: 'foreign-land-drift' },
        { color: '#878787', opacity: 0.16, weight: 57, className: 'foreign-land-drift' },
        { color: '#a4a4a4', opacity: 0.13, weight: 69, className: 'foreign-land-drift' },
        { color: '#c0c0c0', opacity: 0.1, weight: 79, className: 'foreign-land-drift' },
        { color: '#d8d8d8', opacity: 0.07, weight: 86, className: 'foreign-land-drift' }
      ].map(style => ({
        fill: false,
        stroke: true,
        lineJoin: 'round',
        lineCap: 'round',
        ...style
      }));

      [foreignCoastline, italyBoundary].forEach(edgeGeometry => {
        fogFeatherStyles.slice().reverse().forEach(({ className, ...style }) => {
          L.geoJSON(edgeGeometry, {
            pane: 'foreignFogPane',
            interactive: false,
            className,
            style
          }).addTo(map);
        });
      });

      fogFeatherStyles.slice().reverse().forEach(({ className, ...style }) => {
        L.geoJSON(supplementalFogIslands, {
          pane: 'foreignFogPane',
          interactive: false,
          className,
          style
        }).addTo(map);
      });

      L.geoJSON(foreignCountries, {
        pane: 'foreignFogPane',
        interactive: false,
        className: 'foreign-land-fog',
        style: fogCoreStyle
      }).addTo(map);
    }

    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json')
      .then(response => {
        if (!response.ok) throw new Error('Impossibile caricare i confini delle nazioni');
        return response.json();
      })
      .then(addForeignLandFog)
      .catch(error => console.warn('Layer nebbia non caricato:', error));

    const markerGroup = L.markerClusterGroup({
      maxClusterRadius: 40,
      iconCreateFunction: function (cluster) {
        const count = cluster.getChildCount();
        const size = count < 10 ? 'small' : count < 100 ? 'medium' : 'large';
        return L.divIcon({
          html: `<div style="width:36px;height:36px;background:#c0392b;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-weight:bold;color:white;font-size:${size === 'large' ? '14px' : '12px'}">${count}</div>`,
          iconSize: [36, 36],
          iconAnchor: [18, 18],
          className: 'marker-cluster'
        });
      }
    });

    const mkIcon = (active = false) => L.divIcon({
      className: '',
      html: `<div style="width:${active ? 18 : 14}px;height:${active ? 18 : 14}px;background:${active ? '#7b241c' : '#c0392b'};border-radius:50%;border:2px solid white;box-shadow:0 1px 5px rgba(0,0,0,.5)"></div>`,
      iconSize: [active ? 18 : 14, active ? 18 : 14], iconAnchor: [active ? 9 : 7, active ? 9 : 7], popupAnchor: [0, -10]
    });

    let SEDI = [];
    let markers = [], activeIdx = null, filtered = [], visibleMarkers = new Set();

    function buildPopup(s) {
      return `<div style="font-family:sans-serif;min-width:170px;line-height:1.6">
    <b style="font-size:13px;color:#c0392b">${s.t}</b><br>
    <span style="font-size:12px;color:#555">📍 ${s.a}, ${s.c} ${s.z}</span>
    ${s.p ? `<br><span style="font-size:12px">📞 ${s.p}</span>` : ''}
    ${s.e ? `<br><span style="font-size:12px">✉️ ${s.e}</span>` : ''}
  </div>`;
    }

    function renderList(indices) {
      const list = document.getElementById('list');
      const emptyState = document.getElementById('empty-state');
      list.innerHTML = '';

      if (indices.length === 0) {
        emptyState.classList.add('visible');
        return;
      }

      emptyState.classList.remove('visible');
      const slice = indices.slice(0, 200);
      slice.forEach(i => {
        const s = SEDI[i];
        const d = document.createElement('div');
        d.className = 'item' + (activeIdx === i ? ' active' : '');
        d.innerHTML = `<h3>${s.t}</h3><p>${s.a}<br>${s.c}${s.z ? ' (' + s.z + ')' : ''}</p>`;
        d.addEventListener('click', () => focusSede(i), { passive: true });
        list.appendChild(d);
      });
      if (indices.length > 200) {
        const more = document.createElement('div');
        more.style = 'padding:12px;text-align:center;font-size:12px;color:#aaa';
        more.textContent = `+${indices.length - 200} altre sedi — raffina la ricerca`;
        list.appendChild(more);
      }
    }

    function focusSede(i) {
      activeIdx = i;
      const s = SEDI[i];
      map.setView([s.la, s.ln], 14, { animate: true });
      if (markers[i]) markers[i].openPopup();
      const visibleIndices = Array.from(visibleMarkers);
      renderList(visibleIndices);
      const idx = visibleIndices.indexOf(i);
      const items = document.querySelectorAll('.item');
      if (idx >= 0 && items[idx]) items[idx].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function filterSedi(q) {
      const qlo = q.toLowerCase().trim();
      filtered = qlo ? SEDI.map((_, i) => i).filter(i => {
        const s = SEDI[i];
        return s.t.toLowerCase().includes(qlo) || s.c.toLowerCase().includes(qlo) || s.a.toLowerCase().includes(qlo);
      }) : SEDI.map((_, i) => i);
      updateVisibleMarkers();

      if (filtered.length > 0 && filtered.length < 50 && qlo) {
        const bounds = L.latLngBounds(filtered.map(i => [SEDI[i].la, SEDI[i].ln]));
        map.fitBounds(bounds, { padding: [40, 40] });
      }
    }

    function updateVisibleMarkers() {
      const bounds = map.getBounds();
      const newVisible = new Set();

      markerGroup.clearLayers();

      filtered.forEach(i => {
        const s = SEDI[i];
        const isInBounds = bounds.contains([s.la, s.ln]);

        if (isInBounds) {
          newVisible.add(i);
          if (!markers[i]) {
            const m = L.marker([s.la, s.ln], { icon: mkIcon() })
              .bindPopup(buildPopup(s));
            m.on('click', () => {
              activeIdx = i;
              updateVisibleMarkers();
              setTimeout(() => { if (markers[i]) markers[i].openPopup(); }, 50);
            });
            markers[i] = m;
          }
          markerGroup.addLayer(markers[i]);
        }
      });

      visibleMarkers = newVisible;

      const visibleIndices = Array.from(visibleMarkers);
      renderList(visibleIndices);
      document.getElementById('count').textContent = `${visibleIndices.length} sedi visibili`;
    }

    map.addLayer(markerGroup);
    map.on('moveend', updateVisibleMarkers);
    map.on('zoomend', updateVisibleMarkers);

    fetch('datiMappa.geojson')
      .then(response => response.json())
      .then(data => {
        SEDI = data.features.map(feature => {
          const props = feature.properties;
          const coords = feature.geometry.coordinates;
          return {
            t: props.nome || props.title || props.name || '',
            a: props.indirizzo || props.address || '',
            c: props.citta || props.city || props.comune || '',
            z: props.cap || props.zip || props.postal_code || '',
            p: props.telefono || props.phone || props.tel || '',
            e: props.email || props.mail || '',
            la: coords[1],
            ln: coords[0]
          };
        });

        filtered = SEDI.map((_, i) => i);
        updateVisibleMarkers();
        document.getElementById('count').textContent = `${SEDI.length} sedi totali`;
      })
      .catch(error => {
        console.error('Errore caricamento dati:', error);
        document.getElementById('count').textContent = 'Errore caricamento';
      });

    const ROWS = [
      ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
      ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
      ['Z', 'X', 'C', 'V', 'B', 'N', 'M', '⌫'],
      ['SPAZIO', "'", '.', '-', 'CERCA']
    ];

    let kbValue = '';

    function buildKb() {
      const rowIds = ['row1', 'row2', 'row3', 'row4'];
      ROWS.forEach((row, ri) => {
        const el = document.getElementById(rowIds[ri]);
        row.forEach(k => {
          const btn = document.createElement('button');
          btn.className = 'kb-key';
          if (k === '⌫') {
            btn.classList.add('dark', 'backspace');
            btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>`;
          } else if (k === 'SPAZIO') {
            btn.classList.add('space');
            btn.textContent = 'spazio';
          } else if (k === 'CERCA') {
            btn.classList.add('search-btn');
            btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" style="margin-right:4px"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> Cerca`;
          } else {
            btn.textContent = k;
          }
          btn.addEventListener('touchstart', e => { e.preventDefault(); kbPress(k); }, { passive: false });
          btn.addEventListener('mousedown', e => { e.preventDefault(); kbPress(k); });
          el.appendChild(btn);
        });
      });
    }

    function kbPress(k) {
      if (k === '⌫') { kbValue = kbValue.slice(0, -1); }
      else if (k === 'SPAZIO') { kbValue += ' '; }
      else if (k === 'CERCA') { closeKb(); return; }
      else { kbValue += k; }
      updateKbDisplay();
      applySearch();
    }

    function updateKbDisplay() {
      document.getElementById('kb-text').textContent = kbValue;
      const disp = document.getElementById('search-display');
      if (kbValue) {
        disp.textContent = kbValue;
        disp.classList.remove('placeholder');
        document.getElementById('search-clear').classList.add('visible');
      } else {
        disp.textContent = 'Cerca città o sede...';
        disp.classList.add('placeholder');
        document.getElementById('search-clear').classList.remove('visible');
      }
    }

    function applySearch() { filterSedi(kbValue); }

    function openKb() {
      kbValue = document.getElementById('search-display').classList.contains('placeholder') ? '' : document.getElementById('search-display').textContent;
      document.getElementById('kb-text').textContent = kbValue;
      document.getElementById('kb-overlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeKb() {
      document.getElementById('kb-overlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('kb-overlay')) closeKb();
    }

    function clearSearch(e) {
      e.stopPropagation();
      kbValue = '';
      updateKbDisplay();
      filterSedi('');
    }

    buildKb();

    document.addEventListener('keydown', e => {
      if (!document.getElementById('kb-overlay').classList.contains('open')) return;

      const key = e.key.toUpperCase();

      if (key === 'BACKSPACE') {
        e.preventDefault();
        kbPress('⌫');
      } else if (key === ' ') {
        e.preventDefault();
        kbPress('SPAZIO');
      } else if (key === 'ENTER') {
        e.preventDefault();
        kbPress('CERCA');
      } else if (/^[A-Z0-9'.\-]$/.test(key)) {
        e.preventDefault();
        kbPress(key);
      }
    });

    let lastTap = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTap < 300) { e.preventDefault(); }
      lastTap = now;
    }, { passive: false });
  </script>
</body>

</html>
